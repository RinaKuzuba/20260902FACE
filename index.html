<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おむすびフェイス 調整台</title>
<style>
  :root{--bg:#1a1610;--card:#251f18;--line:#3a3227;--fg:#f2ece2;--dim:#a2947f;--accent:#e8c07a}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);min-height:100%;
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{padding:10px 14px 4px}
  h1{margin:0;font-size:.98rem;font-weight:700}
  header p{margin:2px 0 0;font-size:.7rem;color:var(--dim);line-height:1.6}
  .wrap{padding:0 10px 20px}
  #stage{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
  #cam{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
  #cv{display:block;width:100%;height:auto}
  #vid{position:absolute;width:1px;height:1px;opacity:0}
  #riceBox{width:44%;max-width:220px;background:#fbf5ea;border:1px solid var(--line);
    border-radius:10px;display:flex;align-items:flex-end;justify-content:center;padding:6px}
  #rice{display:block;width:100%;height:auto;image-rendering:pixelated}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
  .row{display:flex;align-items:center;gap:10px;margin:6px 0}
  .row span.lb{font-size:.72rem;color:var(--dim);min-width:5.4em}
  .row output{font-size:.72rem;color:var(--accent);min-width:2.6em;text-align:right}
  input[type=range]{flex:1;min-width:80px;accent-color:var(--accent)}
  button{font:inherit;cursor:pointer}
  .btn{width:100%;padding:13px;border-radius:10px;border:0;font-weight:700;background:var(--accent);color:#2a1f10}
  table{width:100%;border-collapse:collapse;font-size:.68rem}
  td{padding:3px 0;border-top:1px solid var(--line);color:var(--dim)}
  td:nth-child(2),td:nth-child(3){text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
  td.hit{color:var(--accent);font-weight:700}
  h2{font-size:.74rem;color:var(--dim);margin:0 0 6px;font-weight:600}
  .note{font-size:.66rem;color:var(--dim);line-height:1.7}
</style>
</head>
<body>
<header>
  <h1>おむすびフェイス 調整台 <span id="ver"></span></h1>
  <p>顔のパーツをおむすびに描きます。誇張率などを動かして、見え方を確かめるための道具です。</p>
</header>
<div class="wrap">
  <div id="stage">
    <div id="cam"><video id="vid" playsinline muted autoplay></video><canvas id="cv"></canvas></div>
    <div id="riceBox"><canvas id="rice" width="196" height="210"></canvas></div>
  </div>

  <button class="btn" id="start">カメラを開始</button>

  <div class="card">
    <div class="row"><span class="lb">誇張率</span><input type="range" id="k" min="1" max="4" step="0.1" value="2.5"><output id="ko">2.5</output></div>
    <div class="row"><span class="lb">顔の大きさ</span><input type="range" id="sz" min="0.30" max="0.70" step="0.01" value="0.45"><output id="szo">0.45</output></div>
    <div class="row"><span class="lb">顔の高さ</span><input type="range" id="hi" min="0.30" max="0.70" step="0.01" value="0.45"><output id="hio">0.45</output></div>
  </div>

  <div class="card">
    <h2>実測値 / 誇張後（基準値との比較）</h2>
    <table id="tbl"></table>
    <p class="note" id="pick">—</p>
  </div>

  <div class="card">
    <h2>体型のしきい値（顔の縦横比）</h2>
    <table id="thr"></table>
  </div>
  <div class="card">
    <h2>基準値づくり</h2>
    <div class="row"><button class="btn" id="add">いまの顔をサンプルに加える</button></div>
    <p class="note" id="samp">サンプル 0 件</p>
    <pre class="note" id="out" style="white-space:pre-wrap"></pre>
  </div>
  <p class="note" id="diag">未起動</p>
</div>

/* ---- MediaPipe（ESM は vision_bundle.mjs を明示：検証済み） ---- */
const MP={versions:["1.0.1","0.10.14"],
  cdns:["https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@","https://unpkg.com/@mediapipe/tasks-vision@"]};
const MODELS=["https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
  "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"];
let FilesetResolver,FaceLandmarker,wasmBase,mpTag='';
async function loadMP(){
  let last;
  for(const v of MP.versions) for(const cdn of MP.cdns){
    const root=cdn+v;
    try{ const m=await import(root+"/vision_bundle.mjs");
      if(!m.FilesetResolver||!m.FaceLandmarker) throw new Error('exports missing');
      FilesetResolver=m.FilesetResolver; FaceLandmarker=m.FaceLandmarker;
      wasmBase=root+"/wasm"; mpTag=v; return;
    }catch(e){ last=e; }
  }
  throw last;
}

const $=id=>document.getElementById(id);
const vid=$('vid'), cv=$('cv'), cx2=cv.getContext('2d');
const rice=$('rice'), rx=rice.getContext('2d');
const off=document.createElement('canvas'); off.width=49; off.height=53;
const ox=off.getContext('2d');
let landmarker=null, stream=null, running=false, lastT=-1;
let K=2.5, SZ=0.45, HI=0.45;   // 5体すべてで顔が胴に収まることを実測で確認した値
for(const [id,fn] of [['k',v=>K=v],['sz',v=>SZ=v],['hi',v=>HI=v]]){
  $(id).addEventListener('input',e=>{ fn(+e.target.value); $(id+'o').textContent=e.target.value; });
}

$('start').onclick=async()=>{
  $('start').textContent='よみこみ中…'; $('start').disabled=true;
  try{ await loadMP(); }catch(e){
    const framed=(()=>{try{return window.self!==window.top}catch(_){return true}})();
    $('start').textContent='E1 よみこめません'; 
    $('diag').textContent = framed?'このプレビューは外部CDNを遮断します。保存してブラウザで開いてください。':'通信を確認してください。';
    return;
  }
  try{
    const fs=await FilesetResolver.forVisionTasks(wasmBase);
    let err;
    outer: for(const url of MODELS) for(const dg of ['GPU','CPU']){
      try{ landmarker=await FaceLandmarker.createFromOptions(fs,{
        baseOptions:{modelAssetPath:url,delegate:dg}, runningMode:'VIDEO', numFaces:1});
        $('diag').textContent='tasks-vision '+mpTag+' / '+dg; break outer;
      }catch(e){ err=e; }
    }
    if(!landmarker){ $('start').textContent='E3 モデル不可'; $('diag').textContent=String(err); return; }
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960}},audio:false});
    vid.srcObject=stream; await vid.play().catch(()=>{});
    $('start').style.display='none';
    running=true; loop();
  }catch(e){ $('start').textContent='E4 カメラ不可'; $('diag').textContent=String(e&&e.name||e); }
};

function loop(){
  const step=()=>{
    if(!running) return;
    if(vid.readyState>=2){
      if(cv.width!==vid.videoWidth){ cv.width=vid.videoWidth; cv.height=vid.videoHeight; }
      if(vid.currentTime!==lastT){ lastT=vid.currentTime; tick(); }
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* 正規化：両目の外側の角で平行移動・回転・大きさを取り除く（本体アプリと同一） */
function normalize(lm, ar){
  const a=lm[33], b=lm[263];
  const ax=a.x*ar, bx=b.x*ar;
  const c0=(ax+bx)/2, cy0=(a.y+b.y)/2;
  const dx=bx-ax, dy=b.y-a.y, d=Math.hypot(dx,dy)||1e-6;
  const c=dx/d, s=dy/d;
  return lm.map(p=>{ const ux=(p.x*ar-c0)/d, uy=(p.y-cy0)/d;
    return {x:ux*c+uy*s, y:-ux*s+uy*c}; });
}
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});

function measure(n){
  const eyeWr=Math.abs(n[33].x-n[133].x), eyeWl=Math.abs(n[263].x-n[362].x);
  const eyeHr=Math.abs(n[145].y-n[159].y), eyeHl=Math.abs(n[374].y-n[386].y);
  const mY=(n[13].y+n[14].y)/2;
  return {
    inner : Math.abs(n[362].x-n[133].x),
    eyeW  : (eyeWr+eyeWl)/2,
    eyeH  : (eyeHr+eyeHl)/2,
    noseY : n[1].y,
    mouthY: mY,
    mouthW: Math.abs(n[291].x-n[61].x),
    mouthH: Math.abs(n[14].y-n[13].y),
    smile : mY-((n[61].y+n[291].y)/2),      // 正なら口角が上がっている
    aspect: (n[152].y-n[10].y)/Math.abs(n[454].x-n[234].x),
  };
}
const exag=(v,ref)=>ref+K*(v-ref);

function tick(){
  const W=cv.width,H=cv.height;
  cx2.save(); cx2.translate(W,0); cx2.scale(-1,1); cx2.drawImage(vid,0,0,W,H); cx2.restore();
  let res=null; try{ res=landmarker.detectForVideo(vid, performance.now()); }catch(e){}
  const f=res&&res.faceLandmarks&&res.faceLandmarks[0];
  if(!f) return;
  for(const p of f){ cx2.beginPath(); cx2.arc((1-p.x)*W,p.y*H,Math.max(1,W/500),0,6.284);
    cx2.fillStyle='rgba(232,192,122,.7)'; cx2.fill(); }
  const m=measure(normalize(f, W/H));
  lastM=m;
  drawRice(m);
  report(m);
}

function pickBody(aspect){
  const a=exag(aspect,REF.aspect);
  for(const b of BODY) if(a-REF.aspect>=b.d) return {...b, a};
  return {...BODY[BODY.length-1], a};
}

function drawRice(m){
  const b=pickBody(m.aspect);
  const A=ANCHOR[b.n], P=PROFILE[b.n];
  const cxp=A.cx, cyp=A.top+HI*(A.bot-A.top);

  const inner=exag(m.inner,REF.inner), eW=exag(m.eyeW,REF.eyeW), eH=exag(m.eyeH,REF.eyeH);
  const nY=exag(m.noseY,REF.noseY), mY=exag(m.mouthY,REF.mouthY);
  const mW=exag(m.mouthW,REF.mouthW), mH=exag(m.mouthH,REF.mouthH);
  const ecx=inner/2+eW/2;
  const ehDraw=Math.max(0.07,Math.min(0.34,eH*EYE_H_GAIN));

  /* 胴体の実測プロファイル（行ごとの左右端）に対して、顔の端が
     はみ出さない最大の大きさを探す。数値を上げてもはみ出さない。 */
  const MARGIN=0.85;                       // 輪郭ぎりぎりを避ける余裕
  const key=U=>[
    [cxp-(ecx+eW/2)*U, cyp],               // 左目の外端
    [cxp+(ecx+eW/2)*U, cyp],               // 右目の外端
    [cxp-mW/2*U, cyp+mY*U],                // 口の左端
    [cxp+mW/2*U, cyp+mY*U],                // 口の右端
    [cxp,        cyp+(mY+0.06)*U],         // 口の下
    [cxp,        cyp-0.42*U],              // 眉の上
  ];
  const inside=(x,y)=>{
    const r=Math.round(y); if(r<0||r>=P.length) return false;
    const [l,rt]=P[r]; if(rt<=0) return false;
    const c=(l+rt)/2, half=(rt-l)/2*MARGIN;
    return Math.abs(x-c)<=half;
  };
  let U=SZ*A.w, tries=0;
  while(tries++<60 && !key(U).every(([x,y])=>inside(x,y))) U*=0.96;
  const clamped = U < SZ*A.w-1e-6;

  const X=v=>cxp+v*U, Y=v=>cyp+v*U;
  ox.clearRect(0,0,49,53);
  // ほお（鼻より少し下）
  ox.fillStyle='rgba(240,150,150,.55)';
  for(const s2 of [-1,1]) ell(ox, X(s2*(ecx+eW*0.55)), Y(nY+0.10), U*0.13, U*0.08);
  // 目と眉
  for(const s2 of [-1,1]){
    const x=X(s2*ecx), y=Y(0);
    ox.fillStyle='#fffdf8'; ell(ox,x,y,U*eW/2,U*ehDraw/2);
    ox.fillStyle='#4a3524'; ell(ox,x,y+U*ehDraw*0.05,U*eW*0.30,U*ehDraw*0.40);
    ox.fillStyle='#fff'; ell(ox,x-U*eW*0.10,y-U*ehDraw*0.14,U*0.022,U*0.022);
    ox.strokeStyle='#6b4a2c'; ox.lineWidth=Math.max(1,U*0.05); ox.lineCap='round';
    ox.beginPath();
    ox.moveTo(x-U*eW*0.55, y-U*0.30);
    ox.quadraticCurveTo(x, y-U*0.38, x+U*eW*0.55, y-U*0.29);
    ox.stroke();
  }
  // 鼻
  ox.fillStyle='#b98d5e'; ell(ox,X(0),Y(nY),U*0.035,U*0.028);
  // 口
  ox.strokeStyle='#7a5230'; ox.lineWidth=Math.max(1,U*0.055);
  if(mH>0.09){ ox.fillStyle='#8a5a3a'; ell(ox,X(0),Y(mY),U*mW/2*0.7,U*mH/2*1.4); }
  else{
    ox.beginPath(); ox.moveTo(X(-mW/2),Y(mY));
    ox.quadraticCurveTo(X(0),Y(mY+Math.max(0.02,m.smile*K*1.4+0.05)),X(mW/2),Y(mY));
    ox.stroke();
  }

  rx.clearRect(0,0,196,210);
  const im=imgs[b.n];
  if(im.complete) rx.drawImage(im,0,0,196,210);
  rx.imageSmoothingEnabled=false;
  rx.drawImage(off,0,0,196,210);
  $('pick').textContent='体型: '+b.lb+'（誇張後の縦横比 '+b.a.toFixed(2)+' / 実測 '+m.aspect.toFixed(2)+'）'
    + (clamped ? ' ／ はみ出すので自動で '+(U/(SZ*A.w)*100).toFixed(0)+'% に縮小中' : '');
}
function ell(g,x,y,rx_,ry){ g.beginPath(); g.ellipse(x,y,Math.max(.6,rx_),Math.max(.6,ry),0,0,6.284); g.fill(); }

/* 複数人の平均で基準値を作るための蓄積。ここで出た値を REF に貼り替える */
let samples=[], lastM=null;
$('add').onclick=()=>{
  if(!lastM) return;
  samples.push({...lastM});
  const keys=['inner','eyeW','eyeH','noseY','mouthY','mouthW','mouthH','aspect'];
  const avg={}; for(const k of keys) avg[k]=samples.reduce((a,s2)=>a+s2[k],0)/samples.length;
  $('samp').textContent='サンプル '+samples.length+' 件の平均';
  $('out').textContent='const REF={\n'+keys.map(k=>'  '+k.padEnd(6)+': '+avg[k].toFixed(3)+',').join('\n')+'\n};';
};

const LB={inner:'目頭の間隔',eyeW:'目の幅',eyeH:'目の縦',noseY:'鼻の高さ',
  mouthY:'口の高さ',mouthW:'口の幅',mouthH:'口の開き',aspect:'顔の縦横比'};
function report(m){
  let h='<tr><td>項目</td><td>実測</td><td>基準</td></tr>';
  for(const k in LB){
    const d=Math.abs(m[k]-REF[k])/REF[k];
    h+='<tr><td>'+LB[k]+'</td><td class="'+(d>0.15?'hit':'')+'">'+m[k].toFixed(3)+'</td><td>'+REF[k].toFixed(3)+'</td></tr>';
  }
  $('tbl').innerHTML=h;
  let t='';
  const a=exag(m.aspect,REF.aspect);
  let done=false;
  for(const b of BODY){ const hit=!done&&(a-REF.aspect>=b.d); if(hit) done=true;
    t+='<tr><td class="'+(hit?'hit':'')+'">'+b.lb+'</td><td>'+(b.d<-1?'それ以下':(REF.aspect+b.d).toFixed(2)+' 以上')+'</td><td>'+(hit?'← いまここ':'')+'</td></tr>'; }
  $('thr').innerHTML=t;
}
</script>
