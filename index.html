<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>骨格そっくりさん判定</title>
<style>
  :root{
    --bg:#141118; --card:#1e1a24; --line:#332c3d; --fg:#f0eaf5; --dim:#9b8fa8;
    --accent:#ffb3c7;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);min-height:100%;
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{padding:12px 16px 6px}
  h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.03em}
  header p{margin:3px 0 0;font-size:.72rem;color:var(--dim);line-height:1.6}
  .wrap{padding:0 12px 24px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;
    text-align:center;cursor:pointer;min-height:118px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px}
  .slot .emo{font-size:1.7rem;line-height:1}
  .slot .nm{font-size:.76rem;font-weight:600}
  .slot .st{font-size:.62rem;color:var(--dim)}
  .slot canvas{background:#0e0c11;border-radius:8px}
  .slot.done{border-color:var(--accent)}
  button{font:inherit;cursor:pointer}
  .btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:700;font-size:.95rem;
    background:var(--accent);color:#2a1420;margin-top:12px}
  .btn[disabled]{opacity:.35}
  .btn.sub{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:500;font-size:.8rem;padding:11px}

  /* 撮影画面 */
  #shoot{position:fixed;inset:0;background:#0b090e;display:none;flex-direction:column;z-index:20}
  #shoot.on{display:flex}
  #shoot .top{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  #shoot .who{font-size:1rem;font-weight:700}
  #close{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:8px 14px;font-size:.8rem}
  #camwrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #cv{display:block;max-width:100%}
  #prep{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;pointer-events:none}
  #prep.on{display:flex}
  #prep .t{font-size:1.5rem;font-weight:800;letter-spacing:.08em;color:var(--accent);
    animation:pulse 1.1s ease-in-out infinite}
  #prep .s{font-size:.75rem;color:var(--dim)}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){ #prep .t{animation:none} }
  #vid{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  #guide{padding:10px 16px 20px;text-align:center}
  #msg{font-size:.95rem;font-weight:700;min-height:1.4em}
  #bar{height:6px;background:#2a2431;border-radius:99px;margin:10px auto 0;max-width:320px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .12s}
  #sub{font-size:.7rem;color:var(--dim);margin-top:8px;line-height:1.6}
  #shutter{margin:12px auto 0;display:block;width:76px;height:76px;border-radius:50%;
    border:4px solid #4a4155;background:var(--accent);color:#2a1420;font-size:.85rem;font-weight:800}
  #shutter:disabled{background:#3a3344;color:#6d6478;border-color:#332c3d}

  /* 結果 */
  .res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
  .res h2{margin:0 0 8px;font-size:.82rem;color:var(--dim);font-weight:600}
  .pair{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:.9rem}
  .pair:first-of-type{border-top:0}
  .pair .rk{font-size:.7rem;color:var(--dim);width:2.1em}
  .pair .sc{margin-left:auto;font-weight:700;font-size:1rem}
  .parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .part{background:#241f2b;border-radius:10px;padding:8px 10px}
  .part b{display:block;font-size:.68rem;color:var(--dim);font-weight:600}
  .part span{font-size:.88rem}
  .note{font-size:.68rem;color:var(--dim);line-height:1.7;margin-top:10px}
  #meas{position:fixed;inset:0;background:#0f0d12;display:none;z-index:40;overflow:auto}
  #meas.on{display:block}
  .mbox{padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
  .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .mtop button{background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:10px;padding:8px 14px;font-size:.8rem}
  .mrow{display:flex;gap:8px;align-items:flex-start}
  #mCam{flex:1;min-width:0;width:100%;height:auto;border-radius:8px;background:#000}
  #mRice{width:42%;max-width:180px;height:auto;background:#fbf5ea;border-radius:8px;image-rendering:pixelated}
  .mctl label{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--dim);margin:6px 0}
  .mctl input{flex:1;accent-color:var(--accent)}
  .mctl output{min-width:2.6em;text-align:right;color:var(--accent);font-size:.74rem}
  #mTbl{width:100%;border-collapse:collapse;font-size:.68rem}
  #mTbl td{padding:3px 0;border-top:1px solid var(--line);color:var(--dim)}
  #mTbl td:nth-child(2),#mTbl td:nth-child(3){text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
  #mTbl td.hit{color:var(--accent);font-weight:700}
  #mOut{white-space:pre-wrap;word-break:break-all;margin-top:8px}
  #sheet{position:fixed;inset:0;background:rgba(10,8,13,.72);display:none;z-index:30;
    align-items:flex-end;justify-content:center}
  #sheet.on{display:flex}
  .sheetbox{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;
    width:100%;max-width:520px;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
  .sheetbox h3{margin:0 0 4px;font-size:1rem}
  .sheetbox p{margin:0 0 6px;font-size:.7rem;color:var(--dim);line-height:1.6}
  /* 発表演出 */
  .reveal{background:var(--card);border:1px solid var(--accent);border-radius:16px;
    padding:22px 14px;text-align:center;margin-top:10px}
  .reveal .rank{font-size:.75rem;color:var(--dim);letter-spacing:.1em}
  .reveal .who2{font-size:1.25rem;font-weight:700;margin:8px 0}
  .reveal .big{font-size:2.4rem;font-weight:800;color:var(--accent);line-height:1}
  .done-list .pair{opacity:.75}
  details{font-size:.7rem;color:var(--dim);margin-top:10px}
  details pre{white-space:pre-wrap;word-break:break-all;font-size:.66rem;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>骨格そっくりさん判定</h1>
  <p>髪型もヒゲも見ません。目・鼻・口・輪郭の配置だけで、誰と誰が近いかを出します。写真は保存しません。<span id="ver"></span></p>
</header>

<div class="wrap">
  <div class="grid" id="grid"></div>
  <button class="btn" id="go" disabled>結果を見る</button>
  <div id="out"></div>
  <button class="btn sub" id="wipe">ぜんぶ消す</button>
  <p class="note" id="ttl"></p>
  <button class="btn sub" id="openMeas">測定モード（おむすびの調整）</button>
  <details><summary>診断情報</summary><pre id="diag">未起動</pre></details>
</div>

<div id="sheet"><div class="sheetbox">
  <h3 id="shTitle"></h3>
  <p id="shSub"></p>
  <button class="btn" id="shRetake">撮りなおす</button>
  <button class="btn sub" id="shJit">ブレを測る（もう一度撮る）</button>
  <button class="btn sub" id="shCancel">とじる</button>
</div></div>

<div id="meas"><div class="mbox">
  <div class="mtop"><b>測定モード</b><button id="mClose">とじる</button></div>
  <div class="mrow"><canvas id="mCam"></canvas><canvas id="mRice" width="196" height="210"></canvas></div>
  <div class="mctl">
    <label>誇張率 <input type="range" id="mK" min="1" max="4" step="0.1"><output id="mKo"></output></label>
    <label>大きさ <input type="range" id="mSZ" min="0.20" max="0.42" step="0.01"><output id="mSZo"></output></label>
    <label>高さ <input type="range" id="mHI" min="0.20" max="0.60" step="0.01"><output id="mHIo"></output></label>
  </div>
  <table id="mTbl"></table>
  <div id="mPick" class="note"></div>
  <button class="btn" id="mAdd">いまの顔を基準値サンプルに加える</button>
  <div id="mOut" class="note"></div>
</div></div>

<div id="shoot">
  <div class="top"><div class="who" id="who"></div><button id="close">やめる</button></div>
  <div id="camwrap"><video id="vid" playsinline muted autoplay></video><canvas id="cv"></canvas>
    <div id="prep"><div class="t">じゅんびちゅう…</div><div class="s" id="prepSub">カメラをよびだしています</div></div>
  </div>
  <div id="guide">
    <div id="msg">じゅんびちゅう…</div>
    <div id="bar"><i></i></div>
    <div id="sub">正面をむいて、口をとじてください</div>
    <button id="shutter" disabled>とる</button>
    <button class="btn sub" id="retry" style="display:none;max-width:240px;margin:10px auto 0">カメラをやりなおす</button>
  </div>
</div>

<script type="module">
/* ============================================================
   ライブラリ（ESM は vision_bundle.mjs を明示：検証済み）
   ============================================================ */
const VER='v13';
document.getElementById('ver').textContent=' ('+VER+')';

/* どこで止まったかを常に追跡する。例外も全部拾って表示する */
let stage='起動';
const errlog=[];
function logErr(kind,e){
  errlog.push(kind+': '+String(e&&e.message||e).slice(0,120));
  if(errlog.length>5) errlog.shift();
  const d=document.getElementById('diag');
  d.textContent=d.textContent.split('\n--- エラー')[0]+'\n--- エラー ---\n'+errlog.join('\n');
}
addEventListener('error', ev=>logErr('error', ev.error||ev.message));
addEventListener('unhandledrejection', ev=>logErr('promise', ev.reason));

const MP={versions:["1.0.1","0.10.14"],
  cdns:["https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@","https://unpkg.com/@mediapipe/tasks-vision@"]};
const MODELS=["https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
  "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"];
let FilesetResolver,FaceLandmarker,wasmBase,mpTag='';
async function loadMP(){
  let last;
  for(const v of MP.versions) for(const cdn of MP.cdns){
    const root=cdn+v;
    try{
      const m=await import(root+"/vision_bundle.mjs");
      if(!m.FilesetResolver||!m.FaceLandmarker) throw new Error('exports missing');
      FilesetResolver=m.FilesetResolver; FaceLandmarker=m.FaceLandmarker;
      wasmBase=root+"/wasm"; mpTag=v+(cdn.includes('jsdelivr')?' jsDelivr':' unpkg'); return;
    }catch(e){ last=e; }
  }
  throw last;
}

    [cxp,cyp+(mY+0.06)*U],[cxp,cyp-0.42*U]];
  const inside=(x,y)=>{ const r=Math.round(y); if(r<0||r>=P.length) return false;
    const [l,rt]=P[r]; if(rt<=0) return false;
    const c=(l+rt)/2, half=(rt-l)/2*MARGIN; return Math.abs(x-c)<=half; };
  let U=Math.min(SZ,SZ_CAP)*A.w, t=0;
  while(t++<60 && !key(U).every(([x,y])=>inside(x,y))) U*=0.96;
  const X=v=>cxp+v*U, Y=v=>cyp+v*U;
  const el=(g,x,y,a2,b2)=>{ g.beginPath(); g.ellipse(x,y,Math.max(.6,a2),Math.max(.6,b2),0,0,6.284); g.fill(); };

  ofx.clearRect(0,0,49,53);
  ofx.fillStyle='rgba(240,150,150,.55)';
  for(const s2 of [-1,1]) el(ofx,X(s2*(ecx+eW*0.55)),Y(nY+0.10),U*0.13,U*0.08);
  for(const s2 of [-1,1]){
    const x=X(s2*ecx), y=Y(0);
    ofx.fillStyle='#fffdf8'; el(ofx,x,y,U*eW/2,U*ehD/2);
    ofx.fillStyle='#4a3524'; el(ofx,x,y+U*ehD*0.05,U*eW*0.30,U*ehD*0.40);
    ofx.fillStyle='#fff'; el(ofx,x-U*eW*0.10,y-U*ehD*0.14,U*0.022,U*0.022);
    ofx.strokeStyle='#6b4a2c'; ofx.lineWidth=Math.max(1,U*0.05); ofx.lineCap='round';
    ofx.beginPath(); ofx.moveTo(x-U*eW*0.55,y-U*0.30);
    ofx.quadraticCurveTo(x,y-U*0.38,x+U*eW*0.55,y-U*0.29); ofx.stroke();
  }
  ofx.fillStyle='#b98d5e'; el(ofx,X(0),Y(nY),U*0.035,U*0.028);
  ofx.strokeStyle='#7a5230'; ofx.lineWidth=Math.max(1,U*0.055);
  if(mH>0.09){ ofx.fillStyle='#8a5a3a'; el(ofx,X(0),Y(mY),U*mW/2*0.7,U*mH/2*1.4); }
  else{ ofx.beginPath(); ofx.moveTo(X(-mW/2),Y(mY));
    ofx.quadraticCurveTo(X(0),Y(mY+Math.max(0.02,m.smile*K*1.4+0.05)),X(mW/2),Y(mY)); ofx.stroke(); }

  const g=cvs.getContext('2d'), W=cvs.width, H=cvs.height;
  g.clearRect(0,0,W,H);
  const im=imgs[b.n];
  g.imageSmoothingEnabled=false;
  if(im.complete) g.drawImage(im,0,0,W,H);
  g.drawImage(off,0,0,W,H);
  return b;
}

/* ============================================================
   正規化：両目の外側の角を基準に、平行移動・回転・大きさを取り除く。
   x は縦横比を掛けて正方画素に直す（これを忘れるとカメラの縦横比で結果が変わる）。
   ============================================================ */
function normalize(lm, ar){
  const a=lm[33], b=lm[263];
  const ax=a.x*ar, bx=b.x*ar;
  const cx0=(ax+bx)/2, cy0=(a.y+b.y)/2;
  const dx=bx-ax, dy=b.y-a.y, d=Math.hypot(dx,dy)||1e-6;
  const c=dx/d, s=dy/d;
  return lm.map(p=>{
    const ux=(p.x*ar-cx0)/d, uy=(p.y-cy0)/d;
    return {x:ux*c+uy*s, y:-ux*s+uy*c};
  });
}
/* 正面度と口の開き（正規化後の座標で判定） */
function quality(n){
  const L=Math.abs(n[234].x), R=Math.abs(n[454].x);
  const yaw=Math.abs(R-L)/(R+L||1);          // 0 が正面
  const roll=0;                               // 回転は正規化で除去済み
  const open=Math.abs(n[14].y-n[13].y);       // 口の開き
  return {yaw, open, roll};
}
/* 鼻の点を幾何的に選ぶ（番号を記憶に頼らない）。初回に決めて保存し、以後固定 */
/* おむすびの描画と測定に必ず要る点。間引きで落ちないよう別枠で持つ */
const MUST=[1,10,13,14,33,61,133,145,152,159,234,263,291,362,374,386,454];
function buildSchema(n){
  const used=new Set([...EYES,...LIPS,...OVAL]);
  const nose=[];
  for(let i=0;i<n.length && i<468;i++){
    if(used.has(i)) continue;
    if(Math.abs(n[i].x)<0.30 && n[i].y>0.10 && n[i].y<0.55) nose.push(i);
  }
  const thin=(a,k)=>a.filter((_,i)=>i%k===0);
  const sch={ eyes:EYES, nose:thin(nose,Math.max(1,Math.ceil(nose.length/20))).slice(0,20),
              mouth:thin(LIPS,2), oval:thin(OVAL,2) };
  const have=new Set([...sch.eyes,...sch.nose,...sch.mouth,...sch.oval]);
  sch.key=MUST.filter(i=>!have.has(i));   // 重複させると距離が二重計上になる
  return sch;
}
const allIdx=s=>[...s.eyes,...s.nose,...s.mouth,...s.oval,...(s.key||[])];

/* 部位ごとの距離（小さいほど近い） */
function dist(v1,v2,ids,map){
  let s=0;
  for(const i of ids){ const a=v1[map[i]], b=v2[map[i]];
    s+=Math.hypot(a.x-b.x,a.y-b.y); }
  return s/ids.length;
}

   判定ロジックと保存には触らない。

let measuring=false, lastM=null, samples=[];
const mCam=$('mCam'), mcx=mCam.getContext('2d');
for(const [id,set] of [['mK',v=>K=v],['mSZ',v=>SZ=v],['mHI',v=>HI=v]]){
  const el=$(id); el.value = id==='mK'?K:(id==='mSZ'?SZ:HI);
  $(id+'o').textContent=el.value;

}

$('mAdd').onclick=()=>{

  $('mOut').textContent='サンプル'+samples.length+'件の平均\n'

const MLB={inner:'目頭の間隔',eyeW:'目の幅',eyeH:'目の縦',noseY:'鼻の高さ',
  mouthY:'口の高さ',mouthW:'口の幅',mouthH:'口の開き',aspect:'顔の縦横比'};
function measureTick(lm,W,H){
  if(mCam.width!==W){ mCam.width=W; mCam.height=H; }
  mcx.save(); mcx.translate(W,0); mcx.scale(-1,1); mcx.drawImage(vid,0,0,W,H); mcx.restore();
  for(const p of lm){ mcx.beginPath(); mcx.arc((1-p.x)*W,p.y*H,Math.max(1,W/500),0,6.284);
    mcx.fillStyle='rgba(255,179,199,.7)'; mcx.fill(); }
  const n=normalize(lm,W/H);
  // ライブの点から測定値を作る（保存ベクトルからの復元と同じ式）
  const map={}; const v=[]; let i=0;
  for(const idx of MUST){ map[idx]=i++; v.push(n[idx]); }
  const m=measureFromVec(v,map);
  lastM=m;
  const b=drawOmusubi($('mRice'),m);
  let h='<tr><td>項目</td><td>実測</td><td>基準</td></tr>';
  for(const k in MLB){ const d=Math.abs(m[k]-REF[k])/REF[k];
    h+='<tr><td>'+MLB[k]+'</td><td class="'+(d>0.15?'hit':'')+'">'+m[k].toFixed(3)+'</td><td>'+REF[k].toFixed(3)+'</td></tr>'; }
  $('mTbl').innerHTML=h;
  $('mPick').textContent='体型: '+b.lb+'（誇張後 '+b.a.toFixed(2)+' / 実測 '+m.aspect.toFixed(2)+'）';
}

/* ---------------- 撮影 ---------------- */
async function openShoot(f, mode){
  target=f; shootMode=mode||'new';
  $('who').textContent=f.emo+' '+f.nm+(shootMode==='jitter'?' の2回目':' をさつえい');
  $('shoot').classList.add('on'); $('msg').textContent='じゅんびちゅう…';
  buf=[]; phase='idle'; $('shutter').disabled=true; $('retry').style.display='none';
  cv.width=0; cv.height=0; cv.style.width=''; cv.style.height='';
  prep(true,'カメラをよびだしています');
  requestAnimationFrame(fitCanvas);   // 開くたびに必ずサイズを引き直す
  // 監視は一番最初に張る。どこで止まっても5秒後に必ず状況が表示される
  stage='初期化';
  clearTimeout(watchdog);
  watchdog=setTimeout(()=>{ if((target||measuring) && frameCount===0) reportStuck(); }, 5000);
  if(!landmarker){
    stage='モデル読込'; prep(true,'はじめての起動なので、すこし時間がかかります');
    try{ await loadMP(); }catch(e){
      const framed=(()=>{try{return window.self!==window.top}catch(_){return true}})();
      prep(false); $('msg').textContent='E1 よみこめません';
      $('sub').textContent = framed?'このプレビューは外部CDNを遮断します。保存してブラウザで開いてください。':'通信を確認してください。';
      return;
    }
    try{
      const fs=await FilesetResolver.forVisionTasks(wasmBase);
      let err;
      outer: for(const url of MODELS) for(const dg of ['GPU','CPU']){
        try{ landmarker=await FaceLandmarker.createFromOptions(fs,{
          baseOptions:{modelAssetPath:url,delegate:dg}, runningMode:'VIDEO', numFaces:1,
          minFaceDetectionConfidence:.4, minFacePresenceConfidence:.4, minTrackingConfidence:.4});
          $('diag').textContent='tasks-vision '+mpTag+' / '+dg; break outer;
        }catch(e){ err=e; }
      }
      if(!landmarker){ prep(false); $('msg').textContent='E3 モデルをよみこめません'; $('sub').textContent=String(err&&err.message||err); return; }
    }catch(e){ prep(false); $('msg').textContent='E2 WASM をよみこめません'; return; }
  }
  // 状態を持ち越さない：毎回まっさらに取り直す
  stage='カメラ解放';
  releaseCam();
  stage='カメラ要求';
  try{
    // getUserMedia はエラーも返さずハングすることがあるため、8秒で打ち切る
    stream=await Promise.race([
      navigator.mediaDevices.getUserMedia(
        {video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout(8s)')),8000)),
    ]);
  }catch(e){
    logErr('getUserMedia',e);
    $('msg').textContent='E4 カメラをひらけません';
    $('sub').textContent=String(e&&e.name||e)+' ／ カメラの許可と https:// を確認してください。';
    prep(false); $('retry').style.display='block'; return;
  }
  stage='再生開始';
  vid.srcObject=stream;
  // play() も返ってこないことがあるので待たない。フレームが来ればループが拾う
  vid.play().then(()=>{ stage='ループ稼働'; }).catch(e=>logErr('play',e));

  lastT=-1; frameCount=0; running=true; loop();
}

function prep(on,txt){
  $('prep').classList.toggle('on',!!on);
  if(txt) $('prepSub').textContent=txt;
}
function releaseCam(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); }
  stream=null; try{ vid.srcObject=null; }catch(e){}
}

/* 3秒たってもフレームが来ないとき、内部状態をそのまま出す。
   原因を推測で潰すより、事実を見せた方が早い。 */
function reportStuck(){
  prep(false);
  const tr = stream && stream.getVideoTracks()[0];
  $('msg').textContent='カメラが動きません（'+VER+'）';
  $('sub').innerHTML='止まった段階: <b>'+stage+'</b>'
    +'<br>track: '+(tr?tr.readyState+' / enabled='+tr.enabled+' / muted='+tr.muted:'なし')
    +'<br>video: paused='+vid.paused+' / readyState='+vid.readyState+' / '+vid.videoWidth+'x'+vid.videoHeight
    +'<br>loop: running='+running+' / frames='+frameCount
    +(errlog.length?'<br>err: '+errlog.join(' / '):'')
    +'<br><b>この表示を撮影して送ってください</b>';
  $('retry').style.display='block';
  $('shutter').disabled=true;
}
$('retry').onclick=()=>{ $('retry').style.display='none'; if(target) openShoot(target, shootMode); };
function closeShoot(){
  running=false; clearTimeout(watchdog);
  releaseCam();                  // 状態を持ち越さない
  // 前回の絵を残さない。0x0 にしておくと、次にフレームが来たとき
  // cv.width!==vid.videoWidth が必ず成立してサイズが引き直される
  cv.width=0; cv.height=0; cv.style.width=''; cv.style.height='';
  $('shoot').classList.remove('on'); target=null; phase='idle'; buf=[];
  $('retry').style.display='none'; prep(false);
  renderGrid();
}
$('close').onclick=closeShoot;

function fitCanvas(){
  // 撮影画面が閉じているとき、中の要素の getBoundingClientRect は全部 0 を返す。
  // スマホはアドレスバーの伸縮で resize が頻発するため、閉じている間に
  // ここが走ると canvas が 0px にされ、以後表示されなくなる（v8までの不具合）。
  if(!$('shoot').classList.contains('on')) return;
  const vw=vid.videoWidth||1280, vh=vid.videoHeight||720;
  const box=$('camwrap').getBoundingClientRect();
  if(box.width<50 || box.height<50) return;   // レイアウト確定前・異常時は書かない
  const s=Math.min(box.width/vw, box.height/vh);
  if(!isFinite(s) || s<=0) return;
  cv.style.width=Math.round(vw*s)+'px'; cv.style.height=Math.round(vh*s)+'px';
}
addEventListener('resize',fitCanvas);
// スマホはアドレスバーの伸縮で表示領域が変わる。resize が来ないこともあるので
// 撮影画面が開いている間は枠そのものを監視する
if(window.ResizeObserver) new ResizeObserver(()=>fitCanvas()).observe($('camwrap'));

/* requestVideoFrameCallback は映像が止まると連鎖が切れて復帰しないため、
   requestAnimationFrame で回す。画面を閉じたら止め、開くたびに張り直す。
   loopId で多重起動を防ぐ。 */
function loop(){
  const my=++loopId;
  const step=()=>{
    if(my!==loopId || !running) return;
    if((target||measuring) && vid.readyState>=2 && landmarker){
      if(cv.width!==vid.videoWidth){ cv.width=vid.videoWidth; cv.height=vid.videoHeight; fitCanvas(); }
      if(vid.currentTime!==lastT){
        lastT=vid.currentTime; frameCount++;
        if(frameCount===1){ stage='ループ稼働'; clearTimeout(watchdog); fitCanvas(); prep(false); }
        tick();
      }
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

const NEED=24;                 // 平均するフレーム数
function tick(){
  const W=cv.width,H=cv.height;
  if(measuring){
    let r=null; try{ r=landmarker.detectForVideo(vid, performance.now()); }catch(e){}
    const f0=r&&r.faceLandmarks&&r.faceLandmarks[0];
    if(f0) measureTick(f0,W,H);
    return;
  }
  cx.save(); cx.translate(W,0); cx.scale(-1,1); cx.drawImage(vid,0,0,W,H); cx.restore();

  let res=null; try{ res=landmarker.detectForVideo(vid, performance.now()); }catch(e){}
  const faces=res&&res.faceLandmarks||[];
  if(!faces.length){ msg('顔が見つかりません','もうすこし近づいてください'); reset(); return; }
  const lm=faces[0], ar=W/H;
  const n=normalize(lm,ar);
  const q=quality(n);
  const eyePx=Math.hypot((lm[263].x-lm[33].x)*W,(lm[263].y-lm[33].y)*H);

  for(const p of lm){ const x=(1-p.x)*W, y=p.y*H;
    cx.beginPath(); cx.arc(x,y,Math.max(1,W/420),0,6.284);
    cx.fillStyle='rgba(255,179,199,.75)'; cx.fill(); }

  $('diag').textContent='正面度(yaw) '+q.yaw.toFixed(3)+' / 口のあき '+q.open.toFixed(3)
    +' / 目の幅 '+Math.round(eyePx)+'px\n閾値: yaw<0.10, あき<0.07, 幅>=90px';

  let ng=null;
  if(eyePx<90) ng=['ちいさすぎます','顔を画面いっぱいに'];
  else if(q.yaw>0.10) ng=['よこを向いています','まっすぐカメラを見て'];
  else if(q.open>0.07) ng=['口があいています','口をとじてください'];

  const now=performance.now();

  if(phase==='idle'){
    $('shutter').disabled = !!ng;
    msg(ng?ng[0]:'じゅんびOK', ng?ng[1]:'ボタンを押すと3秒後にとります');
    bar(0); return;
  }

  if(phase==='count'){
    if(ng){ phase='idle'; msg('やりなおし', ng[1]); bar(0); return; }
    const left=(COUNT-(now-tCount))/1000;
    msg(Math.max(1,Math.ceil(left))+'…','うごかないでください');
    bar(1-left/(COUNT/1000));
    if(left<=0){ phase='shoot'; buf=[]; tShoot=now; }
    return;
  }

  // phase==='shoot'：条件を満たすフレームだけを集める
  if(!ng) buf.push(n);
  bar(buf.length/NEED);
  msg('そのまま…', ng?ng[1]:'うごかないでください');
  if(buf.length>=NEED){ phase='idle'; finish(); return; }
  if(now-tShoot>LIMIT){ phase='idle'; buf=[]; bar(0); msg('うまくとれませんでした','もう一度ボタンを押してください'); }
}
function reset(){ phase='idle'; buf=[]; bar(0); $('shutter').disabled=true; }
const msg=(a,b)=>{ $('msg').textContent=a; $('sub').textContent=b; };
const bar=r=>{ $('bar').firstElementChild.style.width=Math.min(100,r*100)+'%'; };

function finish(){
  if(!DB.schema) DB.schema=buildSchema(buf[buf.length-1]);
  const ids=allIdx(DB.schema);
  const map={}; ids.forEach((v,i)=>map[v]=i);
  const v=ids.map(i=>{
    let x=0,y=0; for(const f of buf){ x+=f[i].x; y+=f[i].y; }
    return {x:x/buf.length, y:y/buf.length};
  });
  // ブレ幅（この人の測定ノイズの目安）
  let jit=0;
  ids.forEach((i,k)=>{ let s=0; for(const f of buf) s+=Math.hypot(f[i].x-v[k].x,f[i].y-v[k].y); jit+=s/buf.length; });
  jit/=ids.length;

  const prev=DB.people[target.id];
  if(shootMode==='jitter' && prev){
    // 1回目の顔と2回目の顔の距離＝測り直しも含めた測定のブレ。
    // 他人同士の差がこれを下回るなら、その差は読み取れていない。
    prev.dself = dist(prev.v, v, allIdx(DB.schema), prev.map);
    prev.t = Date.now();
    msg('ブレを測りました','');
  }else{
    DB.people[target.id]={ v, jit, t:Date.now(), map };
    msg('できました！','');
  }
  store(DB);
  $('shutter').disabled=true; bar(1);
  setTimeout(closeShoot,600);
}

/* ---------------- 結果 ---------------- */
/* ---------------- 結果：計算 ---------------- */
function computeResults(){
  const ppl=FRUITS.filter(f=>DB.people[f.id]);
  const S=DB.schema, map=DB.people[ppl[0].id].map;
  const parts={ '目':S.eyes, '鼻':S.nose, '口':S.mouth, '輪郭':S.oval };
  const all=allIdx(S);

  const pairs=[];
  for(let i=0;i<ppl.length;i++) for(let j=i+1;j<ppl.length;j++){
    const A=DB.people[ppl[i].id], B=DB.people[ppl[j].id];
    const pd={}; for(const k in parts) pd[k]=dist(A.v,B.v,parts[k],map);
    pairs.push({a:ppl[i],b:ppl[j],d:dist(A.v,B.v,all,map),pd});
  }
  pairs.sort((x,y)=>x.d-y.d);
  const dmin=pairs[0].d, dmax=pairs[pairs.length-1].d, rng=(dmax-dmin)||1;
  const sc=d=>pairs.length<2?100:Math.round(100-40*(d-dmin)/rng);

  const mean=all.map((idx,k)=>{
    let x=0,y=0; for(const f of ppl){ const q=DB.people[f.id].v[k]; x+=q.x; y+=q.y; }
    return {x:x/ppl.length,y:y/ppl.length};
  });
  const far=ppl.map(f=>({f,d:dist(DB.people[f.id].v,mean,all,map)})).sort((a,b)=>a.d-b.d);

  // 測定のブレ：実測(自分×自分)があればそれを使う。無ければ撮影中のゆれで代用
  const ds=ppl.map(f=>DB.people[f.id].dself).filter(x=>x!=null);
  const noise = ds.length ? ds.reduce((a,b)=>a+b,0)/ds.length
                          : ppl.reduce((a,f)=>a+DB.people[f.id].jit,0)/ppl.length*2;
  return {ppl,pairs,parts,sc,far,rng,noise,measured:ds.length};
}

/* ---------------- 結果：1組ずつ発表 ---------------- */
let R=null, revealIdx=-1;
$('go').onclick=()=>{
  R=computeResults(); revealIdx=R.pairs.length-1;
  $('out').innerHTML='<div class="reveal"><div class="rank">総当たり '+R.pairs.length+'組</div>'
    +'<div class="who2">下位から発表します</div></div>'
    +'<button class="btn" id="next">はじめる</button><div class="done-list" id="dl"></div>';
  $('next').onclick=stepReveal;
  $('out').scrollIntoView({behavior:'smooth',block:'start'});
};
function stepReveal(){
  if(revealIdx<0) return finishReveal();
  const p=R.pairs[revealIdx], rank=revealIdx+1;
  const top = rank===1;
  document.querySelector('.reveal').innerHTML=
     '<div class="rank">'+(top?'★ 第1位 ★':'第'+rank+'位')+'</div>'
    +'<div class="who2">'+p.a.emo+p.a.nm+' × '+p.b.emo+p.b.nm+'</div>'
    +'<div class="big">'+R.sc(p.d)+'</div>';
  const dl=$('dl');
  dl.insertAdjacentHTML('afterbegin','<div class="pair"><span class="rk">'+rank+'位</span><span>'
    +p.a.emo+' × '+p.b.emo+'</span><span class="sc">'+R.sc(p.d)+'</span></div>');
  revealIdx--;
  $('next').textContent = revealIdx<0 ? 'くわしい結果を見る' : (revealIdx===0 ? '1位を発表' : 'つぎ');
}
function finishReveal(){
  const {ppl,pairs,parts,sc,far,rng,noise,measured}=R;
  let h='<div class="res"><h2>部位別のいちばん</h2><div class="parts">';
  for(const k in parts){
    const best=[...pairs].sort((x,y)=>x.pd[k]-y.pd[k])[0];
    h+='<div class="part"><b>'+k+'</b><span>'+best.a.emo+' × '+best.b.emo+'</span></div>';
  }
  h+='</div></div>';
  h+='<div class="res"><h2>みんなの平均に…</h2>'
    +'<div class="pair"><span>いちばん近い（ふつう顔）</span><span class="sc">'+far[0].f.emo+far[0].f.nm+'</span></div>'
    +'<div class="pair"><span>いちばん遠い（こせい派）</span><span class="sc">'+far[far.length-1].f.emo+far[far.length-1].f.nm+'</span></div></div>';

  // 測定のブレを点数に換算して、順位が読み取れているかを判定
  const noisePt = pairs.length<2 ? 0 : 40*noise/rng;
  const gap = pairs.length<2 ? 0 : sc(pairs[0].d)-sc(pairs[1].d);
  h+='<div class="res"><h2>この結果はどこまで信用できるか</h2>'
    +'<div class="pair"><span>測定のブレ'+(measured?'（実測 '+measured+'人）':'（推定値）')+'</span><span class="sc">約'+noisePt.toFixed(1)+'点</span></div>'
    +'<div class="pair"><span>1位と2位の点差</span><span class="sc">'+gap+'点</span></div>'
    +'<p class="note">'+(pairs.length<2 ? 'ペアが1組しかないので順位はありません。3人以上で測ってください。'
      : gap<=noisePt
      ? '<b>点差がブレより小さいので、この1位はほぼ偶然です。</b>順位は読み取れていません。'
      : '点差がブレを上回っているので、1位は測定のブレでは説明できません。')
    +(measured? '' : '<br>※ブレは推定値です。撮影済みの枠をタップして「ブレを測る」を実行すると実測値になります。')
    +'</p></div>';
  h+='<p class="note">点数はこの'+ppl.length+'人の中での相対値です（100〜60）。別のメンバーで測ると数字は変わります。'
    +'骨格の配置だけを見ており、血縁とは関係ありません。</p>';
  $('out').insertAdjacentHTML('beforeend',h);
  $('next').remove();
}

$('wipe').onclick=()=>{
  if(!confirm('ぜんぶ消します。よろしいですか？')) return;
  DB={schema:null,people:{}}; mem=null;
  try{ localStorage.removeItem(KEY); }catch(e){}
  $('out').innerHTML=''; renderGrid(); toTop();
};

/* ブラウザは前回の読み込み位置を復元する（history.scrollRestoration の既定は auto）。
   結果を下まで読んだ状態で閉じると、次に開いたとき最下部から始まってしまう。
   このアプリは常に一覧の先頭から始めたいので復元を切り、先頭へ戻す。 */
try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(e){}
function toTop(){ try{ window.scrollTo(0,0); }catch(e){} }
toTop();
addEventListener('load', ()=>{ toTop(); requestAnimationFrame(toTop); });

renderGrid();
setInterval(()=>{ const b=Object.keys(DB.people).length; DB=load(); if(Object.keys(DB.people).length!==b) renderGrid(); }, 60000);
</script>
