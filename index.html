<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>顔ランドマーク・ドット表示</title>
<style>
  :root{
    --bg:#12161c; --panel:#1b212a; --line:#2b3441;
    --fg:#e6ebf2; --dim:#8c98a8;
    --eye:#4dd2ff; --nose:#ffc247; --mouth:#ff6fa8; --mesh:#7de3a0;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--fg); min-height:100%;
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{padding:10px 14px 6px}
  h1{margin:0;font-size:1rem;font-weight:600;letter-spacing:.04em}
  header p{margin:2px 0 0;font-size:.72rem;color:var(--dim)}

  #stage{position:relative;margin:8px 10px;border-radius:10px;overflow:hidden;background:#000;
    border:1px solid var(--line);min-height:180px}
  #stage video{display:block;width:100%;height:auto}
  #stage canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  #stage video.mirror{transform:scaleX(-1)}

  #curtain{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;
    background:#0d1116}
  #curtain.hide{display:none}
  #start{font:inherit;font-size:1rem;font-weight:600;color:#0d1116;background:var(--mesh);
    border:0;border-radius:999px;padding:14px 30px;cursor:pointer}
  #start:focus-visible{outline:3px solid var(--eye);outline-offset:3px}
  #curtain p{margin:0;font-size:.78rem;color:var(--dim);line-height:1.7;max-width:32ch}
  #err{color:#ff9d9d;font-size:.8rem;line-height:1.6;max-width:36ch}
  #err b{display:block;font-size:.9rem;margin-bottom:4px}

  #stats{position:absolute;left:8px;top:8px;font-size:.66rem;color:var(--dim);
    background:rgba(13,17,22,.62);padding:4px 8px;border-radius:6px;letter-spacing:.02em}

  .panel{margin:0 10px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row>span.lb{font-size:.75rem;color:var(--dim);min-width:4.5em}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{font:inherit;font-size:.78rem;color:var(--dim);background:transparent;border:0;
    padding:9px 12px;cursor:pointer;min-height:40px}
  .seg button[aria-pressed="true"]{background:#2a3341;color:var(--fg)}
  .seg button+button{border-left:1px solid var(--line)}
  input[type=range]{flex:1;min-width:110px;accent-color:var(--eye)}
  label.chk{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--dim);min-height:40px}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--eye)}
  details{font-size:.72rem;color:var(--dim)}
  details pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-all;color:var(--dim);
    font-size:.68rem;line-height:1.6}
  .key{display:flex;gap:12px;font-size:.7rem;color:var(--dim);flex-wrap:wrap}
  .key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <h1>顔ランドマーク・ドット表示</h1>
  <p>目・鼻・口の位置に点を重ねます。映像は端末内だけで処理し、保存も送信もしません。</p>
</header>

<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="ov"></canvas>
  <div id="stats"></div>
  <div id="curtain">
    <button id="start">カメラを開始</button>
    <p>初回はモデルの読み込みに数秒かかります（通信が必要）。</p>
    <div id="err"></div>
  </div>
</div>

<div class="panel">
  <div class="row">
    <span class="lb">表示する点</span>
    <div class="seg" id="mode">
      <button data-v="4" aria-pressed="true">4点</button>
      <button data-v="8" aria-pressed="false">口の輪郭も</button>
      <button data-v="all" aria-pressed="false">全点</button>
    </div>
  </div>
  <div class="row">
    <span class="lb">点の大きさ</span>
    <input type="range" id="size" min="2" max="16" step="1" value="6">
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="mirror" checked>左右反転</label>
    <label class="chk"><input type="checkbox" id="labels">名前を出す</label>
    <label class="chk"><input type="checkbox" id="smooth" checked>ゆれ止め</label>
    <label class="chk"><input type="checkbox" id="frame">位置合わせ枠</label>
    <button class="segbtn" id="flip" style="font:inherit;font-size:.78rem;color:var(--fg);background:#2a3341;border:1px solid var(--line);border-radius:8px;padding:9px 14px;min-height:40px;cursor:pointer">カメラ切替</button>
  </div>
  <div class="key">
    <span><i style="background:var(--eye)"></i>目</span>
    <span><i style="background:var(--nose)"></i>鼻</span>
    <span><i style="background:var(--mouth)"></i>口</span>
  </div>
  <details>
    <summary>診断情報</summary>
    <pre id="diag">未起動</pre>
  </details>
</div>

<script type="module">
/* ============================================================
   ライブラリ読み込み
   パッケージのルートURLは main(=.cjs) に解決されるので、
   ESM では vision_bundle.mjs を明示する必要がある（前回検証済み）。
   ============================================================ */
const MP = {
  versions: ["1.0.1", "0.10.14"],
  cdns: ["https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@",
         "https://unpkg.com/@mediapipe/tasks-vision@"],
};
const MODELS = [
  "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
  "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",
];

let FilesetResolver=null, FaceLandmarker=null, wasmBase=null, mpTag='';

async function loadMP(){
  let last;
  for(const v of MP.versions) for(const cdn of MP.cdns){
    const root = cdn + v;
    try{
      const m = await import(root + "/vision_bundle.mjs");
      if(!m.FilesetResolver || !m.FaceLandmarker) throw new Error('exports missing');
      FilesetResolver=m.FilesetResolver; FaceLandmarker=m.FaceLandmarker;
      wasmBase=root+"/wasm"; mpTag=v+' ('+(cdn.includes('jsdelivr')?'jsDelivr':'unpkg')+')';
      return;
    }catch(e){ last=e; }
  }
  throw last;
}

/* ============================================================
   ランドマーク番号（1.0.1 の定数から実データで確認したもの）
   ・右目の輪郭 33,133,159,145 / 左目の輪郭 362,263,386,374
   ・口 13(上唇中央) 14(下唇中央) 61,291(口角)
   ・虹彩中心 468(右) 473(左) … 478点モデルのときだけ存在
   ・鼻先 1 … これだけは公式定数に含まれず、キャノニカル定義由来（未検証）
   ============================================================ */
const IDX = {
  eyeR:[33,133,159,145], eyeL:[362,263,386,374],
  irisR:468, irisL:473,
  nose:1,
  mouthTop:13, mouthBottom:14, mouthLeft:61, mouthRight:291,
};

const $=id=>document.getElementById(id);
const vid=$('vid'), ov=$('ov'), octx=ov.getContext('2d');
const curtain=$('curtain'), errBox=$('err'), stats=$('stats'), diag=$('diag');

let landmarker=null, stream=null, facing='user', running=false;
let mode='4', dotSize=6, mirror=true, showLabels=false, smoothing=true, showFrame=false;
let prev=[], lastVideoTime=-1, frames=0, fpsT=0, fps=0, faceCount=0, lmCount=0, argminZ=-1;

/* ---- UI 配線 ---- */
$('mode').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  mode=b.dataset.v;
  [...$('mode').children].forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
});
$('size').addEventListener('input', e=>dotSize=+e.target.value);
$('mirror').addEventListener('change', e=>{ mirror=e.target.checked; applyMirror(); });
$('labels').addEventListener('change', e=>showLabels=e.target.checked);
$('smooth').addEventListener('change', e=>{ smoothing=e.target.checked; prev=[]; });
$('frame').addEventListener('change', e=>showFrame=e.target.checked);
$('flip').addEventListener('click', async()=>{
  facing = facing==='user' ? 'environment' : 'user';
  $('mirror').checked = mirror = (facing==='user');
  applyMirror();
  await startCam();
});
$('start').addEventListener('click', boot, {once:true});

function applyMirror(){ vid.classList.toggle('mirror', mirror); }

/* canvas の表示箱を、video が実際に描かれている矩形にピクセル単位で合わせる。
   CSS の % 指定に任せると、親のレイアウト（フレックスの縮み・letterbox）で
   静かにズレる。ここを毎回実測するのが唯一確実な方法。 */
let boxW=0, boxH=0;
function syncOverlay(){
  const st=document.getElementById('stage');
  const r=vid.getBoundingClientRect(), s=st.getBoundingClientRect();
  if(!r.width || !r.height) return;
  ov.style.left = (r.left-s.left)+'px';
  ov.style.top  = (r.top -s.top )+'px';
  ov.style.width  = r.width+'px';
  ov.style.height = r.height+'px';
  boxW=Math.round(r.width); boxH=Math.round(r.height);
}
addEventListener('resize', syncOverlay);
addEventListener('orientationchange', ()=>setTimeout(syncOverlay,300));
vid.addEventListener('loadedmetadata', syncOverlay);

function bail(code, detail){
  errBox.innerHTML = '<b>'+code+'</b>'+detail;
  $('start').textContent='もう一度試す';
  $('start').addEventListener('click', boot, {once:true});
  curtain.classList.remove('hide');
}

/* ---- 起動 ---- */
async function boot(){
  errBox.textContent=''; $('start').textContent='読み込み中…'; $('start').disabled=true;

  try{ await loadMP(); }
  catch(e){
    const framed=(()=>{try{return window.self!==window.top;}catch(_){return true;}})();
    $('start').disabled=false;
    return bail('E1 モジュールを取得できませんでした',
      framed ? 'このプレビュー画面は外部CDNを遮断します。ファイルを保存してブラウザで直接開くか、GitHub Pages に置いてください。'
             : 'ネットワーク接続を確認してください。');
  }

  let fs;
  try{ fs = await FilesetResolver.forVisionTasks(wasmBase); }
  catch(e){ $('start').disabled=false; return bail('E2 WASM を取得できませんでした','CDN への接続が途中で切れています。時間をおいて再試行してください。'); }

  let lastErr=null, used='';
  outer:
  for(const url of MODELS) for(const delegate of ['GPU','CPU']){
    try{
      landmarker = await FaceLandmarker.createFromOptions(fs,{
        baseOptions:{ modelAssetPath:url, delegate },
        runningMode:'VIDEO', numFaces:2,
        minFaceDetectionConfidence:0.4, minFacePresenceConfidence:0.4, minTrackingConfidence:0.4,
      });
      used = delegate+' / '+url.split('/').slice(-2).join('/');
      break outer;
    }catch(e){ lastErr=e; }
  }
  if(!landmarker){ $('start').disabled=false; return bail('E3 モデルを読み込めませんでした', String(lastErr&&lastErr.message||lastErr)); }

  diag.textContent = 'tasks-vision '+mpTag+'\nmodel: '+used;
  const ok = await startCam();
  if(!ok) return;
  curtain.classList.add('hide');
  if(!running){ running=true; loop(); }
}

async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:facing, width:{ideal:1280}, height:{ideal:720} }, audio:false });
  }catch(e){
    $('start').disabled=false;
    bail('E4 カメラを開けませんでした',
      'ブラウザのカメラ許可を確認してください。https:// でない場所（file:// や http://）ではカメラは使えません。');
    return false;
  }
  vid.srcObject=stream;
  await vid.play().catch(()=>{});
  applyMirror();
  prev=[]; lastVideoTime=-1;
  return true;
}

/* ---- 推論ループ ---- */
function loop(){
  const step=()=>{
    if(vid.readyState>=2 && landmarker){
      if(ov.width!==vid.videoWidth || ov.height!==vid.videoHeight){
        ov.width=vid.videoWidth; ov.height=vid.videoHeight; syncOverlay();
      }
      if(vid.currentTime!==lastVideoTime){
        lastVideoTime=vid.currentTime;
        let res=null;
        try{ res=landmarker.detectForVideo(vid, performance.now()); }catch(e){}
        if(res) draw(res.faceLandmarks||[]);
      }
      frames++;
      const now=performance.now();
      if(now-fpsT>500){ fps=Math.round(frames*1000/(now-fpsT)); frames=0; fpsT=now;
        syncOverlay();
        stats.textContent = fps+' fps ／ 顔 '+faceCount+' ／ 点 '+lmCount;
        const vr=vid.getBoundingClientRect(), or_=ov.getBoundingClientRect();
        const gap=Math.round(Math.abs(vr.height-or_.height))+'x'+Math.round(Math.abs(vr.width-or_.width));
        diag.textContent = diag.textContent.split('\n').slice(0,2).join('\n')
          + '\nframe: '+vid.videoWidth+'x'+vid.videoHeight+' ／ 表示: '+boxW+'x'+boxH
          + '\ncanvasと映像のズレ: '+gap+' px（0x0 が正常）'
          + '\nlandmarks: '+lmCount+' ／ z最小の番号: '+argminZ+'（鼻先なら 1 前後のはず）';
      }
    }
    if('requestVideoFrameCallback' in HTMLVideoElement.prototype) vid.requestVideoFrameCallback(step);
    else requestAnimationFrame(step);
  };
  step();
}

/* ---- 描画 ---- */
const mean=(lm,ids)=>{
  let x=0,y=0; for(const i of ids){ x+=lm[i].x; y+=lm[i].y; }
  return {x:x/ids.length, y:y/ids.length};
};

function draw(faces){
  faceCount=faces.length;
  octx.clearRect(0,0,ov.width,ov.height);
  if(showFrame) drawFrame();
  if(!faces.length){ lmCount=0; prev=[]; return; }
  lmCount=faces[0].length;

  faces.forEach((raw,fi)=>{
    // ゆれ止め（指数移動平均）。点数が変わったらリセット
    let lm=raw;
    if(smoothing && prev[fi] && prev[fi].length===raw.length){
      const a=0.5, p=prev[fi];
      lm = raw.map((q,i)=>({x:p[i].x+(q.x-p[i].x)*a, y:p[i].y+(q.y-p[i].y)*a, z:q.z}));
    }
    prev[fi]=lm;

    if(fi===0){
      let m=Infinity; for(let i=0;i<lm.length;i++) if(lm[i].z<m){ m=lm[i].z; argminZ=i; }
    }

    const hasIris = lm.length>=478;
    const eyeR = hasIris ? lm[IDX.irisR] : mean(lm,IDX.eyeR);
    const eyeL = hasIris ? lm[IDX.irisL] : mean(lm,IDX.eyeL);
    const nose = lm[IDX.nose];
    const mouth = mean(lm,[IDX.mouthTop,IDX.mouthBottom]);

    if(mode==='all'){
      for(const p of lm) dot(p, 'var(--mesh)', Math.max(1.2, dotSize*0.28), null);
    }
    dot(eyeR,'#4dd2ff',dotSize,'右目');
    dot(eyeL,'#4dd2ff',dotSize,'左目');
    dot(nose,'#ffc247',dotSize,'鼻');
    dot(mouth,'#ff6fa8',dotSize,'口');
    if(mode==='8'){
      dot(lm[IDX.mouthLeft],'#ff6fa8',dotSize*0.8,null);
      dot(lm[IDX.mouthRight],'#ff6fa8',dotSize*0.8,null);
      dot(lm[IDX.mouthTop],'#ff6fa8',dotSize*0.8,null);
      dot(lm[IDX.mouthBottom],'#ff6fa8',dotSize*0.8,null);
    }
  });
}

/* canvas が映像とぴったり重なっているかを目視確認するための枠。
   この枠が画面の映像の縁と一致していれば座標系は正しい。 */
function drawFrame(){
  const w=ov.width, h=ov.height, lw=Math.max(2,w/300);
  octx.strokeStyle='#7de3a0'; octx.lineWidth=lw;
  octx.strokeRect(lw/2, lw/2, w-lw, h-lw);
  octx.beginPath();
  octx.moveTo(w/2,0); octx.lineTo(w/2,h);
  octx.moveTo(0,h/2); octx.lineTo(w,h/2);
  octx.globalAlpha=.45; octx.stroke(); octx.globalAlpha=1;
}

function dot(p, color, r, label){
  if(!p) return;
  const s = ov.width/380;                       // 画面幅に対する基準スケール
  const R = r*s*0.55;
  const x = (mirror ? 1-p.x : p.x) * ov.width;
  const y = p.y * ov.height;
  octx.beginPath(); octx.arc(x,y,R,0,Math.PI*2);
  octx.fillStyle=color; octx.globalAlpha=0.95; octx.fill();
  octx.globalAlpha=1;
  octx.lineWidth=Math.max(1,R*0.28); octx.strokeStyle='rgba(0,0,0,.55)'; octx.stroke();
  if(label && showLabels){
    octx.font=Math.round(13*s)+'px system-ui, sans-serif';
    octx.textAlign='center'; octx.textBaseline='bottom';
    octx.lineWidth=Math.max(2,3*s); octx.strokeStyle='rgba(0,0,0,.7)';
    octx.strokeText(label,x,y-R-3*s);
    octx.fillStyle=color; octx.fillText(label,x,y-R-3*s);
  }
}
</script>
</body>
</html>
